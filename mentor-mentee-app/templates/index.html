<!DOCTYPE html>
<html>
<head>

<title>Mentor Mentee Communication</title>

<!-- Socket.IO -->
<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:'Inter', 'Segoe UI', sans-serif;

background: radial-gradient(circle at top left, #1e1b4b, #0f172a);
min-height:100vh;

display:flex;
justify-content:center;
align-items:flex-start;
padding:40px 0;

color:white;

}
body::before{
content:"";
position:absolute;
width:400px;
height:400px;
background:#6366f1;
filter:blur(120px);
top:0;
left:0;
z-index:-1;
opacity:0.4;
}

/* Container */

.container{
background: rgba(255,255,255,0.05);
backdrop-filter: blur(20px);
border-radius:20px;
width:950px;
max-width:95%;
padding:30px;

box-shadow: 
0 10px 40px rgba(0,0,0,0.5),
inset 0 1px rgba(255,255,255,0.05);

border:1px solid rgba(255,255,255,0.08);
}

/* Title */

h1{
text-align:center;
margin-bottom:25px;
font-weight:600;
font-size:24px;

background: linear-gradient(90deg,#60a5fa,#a78bfa);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

/* Controls */

.controls{
display:flex;
gap:10px;
margin-bottom:20px;
flex-wrap:wrap;
}

/* Inputs */

select,input{
padding:10px;
border-radius:10px;
border:1px solid rgba(255,255,255,0.1);
flex:1;

background: rgba(255,255,255,0.05);
color:white;

outline:none;
transition:0.2s;
}

input:focus, select:focus{
border-color:#6366f1;
box-shadow:0 0 0 2px rgba(99,102,241,0.3);
}

/* Buttons */

button{
background: linear-gradient(135deg,#6366f1,#8b5cf6);
border:none;
padding:10px 16px;
border-radius:10px;
color:white;
font-weight:500;
cursor:pointer;

transition:0.25s;
}

button:hover{
transform:translateY(-2px);
box-shadow:0 6px 20px rgba(99,102,241,0.5);
}

/* Chat */

#chat{
height:420px;
overflow-y:auto;
padding:15px;

background: rgba(255,255,255,0.04);
border-radius:15px;
margin-bottom:20px;

border:1px solid rgba(255,255,255,0.06);
}

/* Messages */

.message{
margin:10px 0;
padding:12px 14px;
border-radius:14px;
max-width:65%;
font-size:14px;
line-height:1.4;
}

.mentor{
background: linear-gradient(135deg,#3b82f6,#6366f1);
margin-left:auto;
}

.mentee{
background: rgba(255,255,255,0.08);
margin-right:auto;
}

.time{
font-size:10px;
opacity:0.6;
display:block;
margin-top:4px;
}

/* Doubt Section */

.doubt-section{
background: rgba(255,255,255,0.04);
padding:18px;
border-radius:15px;

border:1px solid rgba(255,255,255,0.06);
}

#doubtText{
margin-right:10px;
}

/* Doubts */

#doubtList{
margin-top:15px;
}

#doubtList p{
background: rgba(255,255,255,0.06);
padding:12px;
border-radius:12px;
margin-bottom:10px;

border:1px solid rgba(255,255,255,0.05);
}

/* Status Indicators */

.pending{
border-left:4px solid #facc15;
}

.answered{
border-left:4px solid #60a5fa;
}

.resolved{
border-left:4px solid #34d399;
}
</style>

</head>

<body>

<div class="container">

<h1>Mentor–Mentee Communication</h1>

<p>Welcome, {{ current_user.username }}! <a href="{{ url_for('logout') }}" style="color: white;">Logout</a></p>

<div class="controls">

<input id="message" placeholder="Type message">

<button onclick="sendMessage()">Send</button>
<button onclick="clearChat()">Clear Chat</button>

</div>

<div id="chat"></div>
<div id="typing" style="font-size:12px; opacity:0.6; margin-bottom:10px;"></div>

<div class="doubt-section">

<h3>Raise a Doubt</h3>

<input id="doubtText" placeholder="Enter your doubt">

<button onclick="raiseDoubt()">Submit Doubt</button>

<div id="doubtList"></div>

</div>

</div>

<script>

const socket = io();

/* ================= CHAT ================= */

async function sendMessage(){

let text=document.getElementById("message").value

if(text.trim()=="") return

await fetch("/send",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({text})
})

document.getElementById("message").value=""
}

socket.on("new_message", function(msg){

let type = msg.role === "mentor" ? "mentor" : "mentee"

let chatBox = document.getElementById("chat")

chatBox.innerHTML += `
<div class="message ${type}">
<b>${msg.sender}</b><br>
${msg.text}
<span class="time">${msg.time}</span>
</div>
`

chatBox.scrollTop = chatBox.scrollHeight

})

async function clearChat(){
await fetch("/clear",{method:"POST"})
document.getElementById("chat").innerHTML = ""
}

/* ================= DOUBTS ================= */

async function raiseDoubt(){

let question=document.getElementById("doubtText").value

if(question.trim()=="") return

await fetch("/raise_doubt",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({question})
})

document.getElementById("doubtText").value=""

loadDoubts()
}

async function loadDoubts(){

let res = await fetch("/doubts")
let data = await res.json()

let html = "<h4>Doubts:</h4>"

data.forEach(d => {

html += `
<p class="${d.status}">
<b>${d.mentee}</b>: ${d.question} 
<br>Status: ${d.status}

${d.answer ? `<br><b>Answer:</b> ${d.answer}` : ""}

${d.status === "pending" ? `
<br>
<input id="ans-${d.id}" placeholder="Write answer">
<button onclick="answerDoubt(${d.id})">Answer</button>
` : ""}

${d.status === "answered" ? `
<br>
<button onclick="resolveDoubt(${d.id})">Mark Resolved</button>
` : ""}

</p>
`
})

document.getElementById("doubtList").innerHTML = html
}

async function answerDoubt(id){

let answer = document.getElementById(`ans-${id}`).value

await fetch("/answer_doubt",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({id, answer})
})

loadDoubts()
}

async function resolveDoubt(id){

await fetch("/resolve_doubt",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({id})
})

loadDoubts()
}

/* ================= INIT ================= */

document.getElementById("message").addEventListener("keypress", function(e){
if(e.key === "Enter"){
sendMessage();
}
});

loadDoubts()

async function loadMessages(){
    let res = await fetch("/messages")
    let data = await res.json()

    let chat = document.getElementById("chat")
    chat.innerHTML = ""

    data.forEach(msg => {
        let type = msg.role === "mentor" ? "mentor" : "mentee"

        chat.innerHTML += `
        <div class="message ${type}">
        <b>${msg.sender}</b> • ${msg.time}<br>
        ${msg.text}
        </div>`
    })

    chat.scrollTop = chat.scrollHeight
}

loadMessages()

// Typing indicator
document.getElementById("message").addEventListener("input", () => {
    socket.emit("typing", {user: "{{ current_user.username }}"})
})

socket.on("typing", data => {
    document.getElementById("typing").innerText = data.user + " is typing..."

    setTimeout(() => {
        document.getElementById("typing").innerText = ""
    }, 1000)
})

</script>

</body>
</html>
