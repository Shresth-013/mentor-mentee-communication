<!DOCTYPE html>
<html>
<head>

<title>Mentor Mentee Communication</title>

<!-- Socket.IO -->
<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

<style>

*{
box-sizing:border-box;
}

body{
font-family:'Segoe UI',sans-serif;

/* University style background */
background: 
linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.7)),
url('https://images.unsplash.com/photo-1523050854058-8df90110c9f1');

background-size: cover;
background-position: center;

display:flex;
justify-content:center;
align-items:flex-start;
min-height:100vh;
margin:0;
padding:40px 0;
}

.container{
background: rgba(20,20,30,0.9);
border-radius:16px;
width:950px;
max-width:95%;
padding:30px;
box-shadow:0 10px 30px rgba(0,0,0,0.6);
color:white;
border:1px solid rgba(255,255,255,0.1);
}

h1{
text-align:center;
margin-bottom:25px;
font-weight:600;
}

.controls{
display:flex;
gap:12px;
margin-bottom:20px;
flex-wrap:wrap;
}

select,input{
padding:10px;
border-radius:8px;
border:1px solid rgba(255,255,255,0.1);
flex:1;
outline:none;
font-size:14px;
background:#111827;
color:white;
}

button{
background:#2563eb;
color:white;
border:none;
padding:10px 14px;
border-radius:8px;
cursor:pointer;
font-weight:500;
transition:0.2s;
}

button:hover{
background:#1e40af;
}

/* Chat Box */

#chat{
height:420px;
overflow-y:auto;
padding:20px;
background:rgba(10,10,15,0.9);
border-radius:12px;
margin-bottom:25px;
color:white;
border:1px solid rgba(255,255,255,0.08);
}

.message{
margin:10px 0;
padding:12px 16px;
border-radius:12px;
max-width:65%;
font-size:14px;
}

.mentor{
background:#2563eb;
color:white;
margin-left:auto;
}

.mentee{
background:#374151;
color:white;
margin-right:auto;
}

.time{
font-size:10px;
opacity:0.7;
display:block;
margin-top:4px;
}

/* Doubt Section */

.doubt-section{
background:rgba(15,15,25,0.9);
padding:20px;
border-radius:12px;
border:1px solid rgba(255,255,255,0.08);
}

#doubtList{
margin-top:15px;
font-size:14px;
}

#doubtList p{
background:#1f2937;
color:white;
padding:12px;
border-radius:10px;
margin-bottom:10px;
border:1px solid rgba(255,255,255,0.05);
}

.pending { border-left: 4px solid #facc15; }
.answered { border-left: 4px solid #3b82f6; }
.resolved { border-left: 4px solid #22c55e; }

</style>

</head>

<body>

<div class="container">

<h1>Mentor–Mentee Communication</h1>

<div class="controls">

<select id="role">
<option value="mentor">Mentor</option>
<option value="mentee1">Mentee 1</option>
<option value="mentee2">Mentee 2</option>
<option value="mentee3">Mentee 3</option>
<option value="mentee4">Mentee 4</option>
<option value="mentee5">Mentee 5</option>
</select>

<input id="message" placeholder="Type message">

<button onclick="sendMessage()">Send</button>
<button onclick="clearChat()">Clear Chat</button>

</div>

<div id="chat"></div>

<div class="doubt-section">

<h3>Raise a Doubt</h3>

<input id="doubtText" placeholder="Enter your doubt">

<button onclick="raiseDoubt()">Submit Doubt</button>

<div id="doubtList"></div>

</div>

</div>

<script>

const socket = io();

/* ================= CHAT ================= */

async function sendMessage(){

let sender=document.getElementById("role").value
let text=document.getElementById("message").value

if(text.trim()=="") return

await fetch("/send",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({sender,text})
})

document.getElementById("message").value=""
}

socket.on("new_message", function(msg){

let type = msg.sender === "mentor" ? "mentor" : "mentee"

let chatBox = document.getElementById("chat")

chatBox.innerHTML += `
<div class="message ${type}">
<b>${msg.sender}</b><br>
${msg.text}
<span class="time">${msg.time}</span>
</div>
`

chatBox.scrollTop = chatBox.scrollHeight

})

async function clearChat(){
await fetch("/clear",{method:"POST"})
document.getElementById("chat").innerHTML = ""
}

/* ================= DOUBTS ================= */

async function raiseDoubt(){

let mentee=document.getElementById("role").value
let question=document.getElementById("doubtText").value

if(question.trim()=="") return

await fetch("/raise_doubt",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({mentee,question})
})

document.getElementById("doubtText").value=""

loadDoubts()
}

async function loadDoubts(){

let res = await fetch("/doubts")
let data = await res.json()

let html = "<h4>Doubts:</h4>"

data.forEach(d => {

html += `
<p class="${d.status}">
<b>${d.mentee}</b>: ${d.question} 
<br>Status: ${d.status}

${d.answer ? `<br><b>Answer:</b> ${d.answer}` : ""}

${d.status === "pending" ? `
<br>
<input id="ans-${d.id}" placeholder="Write answer">
<button onclick="answerDoubt(${d.id})">Answer</button>
` : ""}

${d.status === "answered" ? `
<br>
<button onclick="resolveDoubt(${d.id})">Mark Resolved</button>
` : ""}

</p>
`
})

document.getElementById("doubtList").innerHTML = html
}

async function answerDoubt(id){

let answer = document.getElementById(`ans-${id}`).value

await fetch("/answer_doubt",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({id, answer})
})

loadDoubts()
}

async function resolveDoubt(id){

await fetch("/resolve_doubt",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({id})
})

loadDoubts()
}

/* ================= INIT ================= */

document.getElementById("message").addEventListener("keypress", function(e){
if(e.key === "Enter"){
sendMessage();
}
});

loadDoubts()

</script>

</body>
</html>
